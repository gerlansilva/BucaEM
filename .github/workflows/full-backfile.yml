name: BuscaEM — Backfile internacional

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: buscaem-backfile
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select next incomplete journal
        id: select
        shell: bash
        run: |
          JOURNAL=$(python - <<'PY'
          import json
          from pathlib import Path

          journals = json.loads(Path("dist/data/journals.json").read_text(encoding="utf-8"))
          state_path = Path("harvest/backfile_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}

          for j in journals:
    if not j.get("enabled"):
        continue

    if j.get("collectionStatus") == "integrated":
        continue
              jid = j["id"]
              complete = state.get(jid, {}).get("crossref", {}).get("complete", False)
              if not complete:
                  print(jid)
                  break
          PY
          )
          echo "journal=$JOURNAL" >> "$GITHUB_OUTPUT"
          echo "Next journal: $JOURNAL"

      - name: Harvest one resumable page with official enrichment
        if: steps.select.outputs.journal != ''
        run: |
          python scripts/harvest_backfiles.py             --journal "${{ steps.select.outputs.journal }}"             --max-pages 1

      - name: Rebuild public index
        if: steps.select.outputs.journal != ''
        run: |
          python scripts/reprocess.py || true
          python scripts/publish.py
          python scripts/validate.py || true

      - name: Commit checkpoint and harvested files
        if: steps.select.outputs.journal != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest dist/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "harvest: backfile ${{ steps.select.outputs.journal }}"
            git push
          fi
