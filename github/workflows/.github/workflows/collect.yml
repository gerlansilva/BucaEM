name: BuscaEM — Atualização das fontes oficiais

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: write

concurrency:
  group: buscaem-official-sources
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Harvest official OAI and SciELO sources
        run: |
          python scripts/harvest.py --full --skip-openalex

      - name: Rebuild public index
        run: |
          python scripts/reprocess.py || true
          python scripts/publish.py
          python scripts/validate.py || true

      - name: Commit updated corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest dist/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "harvest: update official sources"
            git push
          fi
